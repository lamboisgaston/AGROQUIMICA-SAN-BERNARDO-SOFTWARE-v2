<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SemillasYa | Licitación pública</title>
  <style>
    :root {
      --bg: #f5f8f6;
      --card: #ffffff;
      --line: #d9e7dd;
      --green-900: #0f5132;
      --green-700: #146c43;
      --green-500: #1e9b5f;
      --text: #173126;
      --muted: #5f7c6e;
      --ok: #dff7e8;
      --ask: #fff3d8;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text); }
    .container { width: min(1180px, calc(100% - 2rem)); margin-inline: auto; }

    .hero {
      color: #fff;
      padding: 3.5rem 0 2.5rem;
      background: radial-gradient(circle at 85% 5%, #44cb86, transparent 30%), linear-gradient(130deg, var(--green-900), var(--green-700));
    }
    .hero h1 { margin: 0 0 .5rem; font-size: clamp(2rem, 6vw, 3.2rem); }
    .hero p { margin: .35rem 0; max-width: 880px; }
    .pill { display: inline-block; padding: .45rem .75rem; border-radius: 999px; background: rgba(255,255,255,.16); font-weight: 700; }

    .section { padding: 1.25rem 0; }
    .title { margin: 0 0 .75rem; font-size: 1.35rem; }

    .brands { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .7rem; }
    .brand-card {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      min-height: 92px; display: flex; align-items: center; justify-content: center; padding: .8rem;
      box-shadow: 0 8px 20px rgba(18, 62, 40, .08);
    }
    .brand-card img { max-width: 100%; max-height: 56px; object-fit: contain; }
    .brand-card span { font-weight: 800; text-align: center; }

    .layout { display: grid; grid-template-columns: 2fr 1fr; gap: 1rem; align-items: start; }
    .panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: .9rem; }
    .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: .7rem; }

    input, select, textarea {
      width: 100%; border: 1px solid #c8dacd; border-radius: 10px; padding: .65rem .75rem; font: inherit;
      background: #fff;
    }

    .catalog { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: .75rem; margin-top: .9rem; }
    .product { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: .8rem; display: grid; gap: .4rem; }
    .status { width: fit-content; border-radius: 999px; padding: .2rem .5rem; font-size: .74rem; font-weight: 800; }
    .status.DISPONIBLE { background: var(--ok); color: #0f6b38; }
    .status.CONSULTAR { background: var(--ask); color: #885700; }
    .meta { color: var(--muted); font-size: .87rem; }

    .btn { border: 0; border-radius: 999px; padding: .62rem .95rem; font-weight: 700; cursor: pointer; }
    .btn-add { background: var(--green-700); color: #fff; }
    .btn-outline { background: #fff; border: 1px solid var(--line); }
    .btn-wa { background: #25d366; color: #06351b; width: 100%; margin-top: .5rem; }

    .cart-item { border: 1px solid var(--line); border-radius: 12px; padding: .55rem; margin-bottom: .55rem; }
    .cart-row { display: flex; justify-content: space-between; gap: .4rem; align-items: center; }
    .qty { width: 80px; }
    .small { color: var(--muted); font-size: .84rem; }

    @media (max-width: 940px) { .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="hero">
    <div class="container">
      <h1>SemillasYa</h1>
      <p class="pill">Armá tu pedido de semillas. Te respondemos por WhatsApp con presupuesto, disponibilidad y fecha estimada de entrega.</p>
      <p><strong>Pagás la semilla y coordinamos entrega en 4 días.</strong></p>
    </div>
  </header>

  <main class="container">
    <section class="section">
      <h2 class="title">Marcas / laboratorios</h2>
      <div class="brands" id="brands"></div>
    </section>

    <section class="section layout">
      <div class="panel">
        <h2 class="title">Catálogo público</h2>
        <div class="filters">
          <select id="lista"></select>
          <select id="filtroCategoria"><option value="TODAS">Todas las categorías</option></select>
          <select id="filtroMarca"><option value="TODAS">Todas las marcas</option></select>
          <select id="filtroEstado"><option value="TODOS">Todos los estados</option><option value="DISPONIBLE">Disponible</option><option value="CONSULTAR">Consultar</option></select>
          <input id="buscar" placeholder="Buscar por producto, marca o presentación" />
        </div>
        <div class="catalog" id="catalog"></div>
      </div>

      <aside class="panel">
        <h2 class="title">Licitación</h2>
        <div id="cart"></div>
        <p class="small" id="cartEmpty">Todavía no agregaste productos.</p>
        <hr style="border:none;border-top:1px solid var(--line);margin: .8rem 0;" />
        <label>Nombre</label><input id="nombre" />
        <label>Teléfono WhatsApp</label><input id="telefono" placeholder="549..." />
        <label>Localidad</label><input id="localidad" />
        <label>Observaciones</label><textarea id="obs" rows="3"></textarea>
        <button class="btn btn-wa" id="enviar">Enviar licitación por WhatsApp</button>
      </aside>
    </section>
  </main>

  <script>
    const marcasVisibles = [
      { nombre: 'Guasch', logo: '/assets/marcas/guasch.png' },
      { nombre: 'CAPS', logo: '/assets/marcas/caps.png' },
      { nombre: 'Garde, Giusti y Chuchuy', logo: '/assets/marcas/ggc.png' },
      { nombre: 'Gasty', logo: '/assets/marcas/gasty.png' },
      { nombre: 'Picasso', logo: '/assets/marcas/picasso.png' },
      { nombre: 'Florensa', logo: '/assets/marcas/florensa.png' }
    ];

    const state = { listas: [], productos: [], carrito: [] };
    const $ = (id) => document.getElementById(id);

    function estadoProducto(p) {
      const s = String(p.estado || p.observaciones || '').toLowerCase();
      if (s.includes('agot') || s.includes('sin stock') || s.includes('consult')) return 'CONSULTAR';
      return 'DISPONIBLE';
    }

    function categoriaProducto(p) { return p.categoria || 'General'; }
    function marcaProducto(p) { return p.marca || p.proveedor || p.listaEmpresa || 'Sin marca'; }
    function presentacionProducto(p) { return p.presentacion || p.unidad || p.um || 'Sin especificar'; }

    function renderBrands() {
      $('brands').innerHTML = marcasVisibles.map((m, i) => `
        <article class="brand-card">
          <img src="${m.logo}" alt="${m.nombre}" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'${m.nombre.replace(/'/g, "\\'")}'}))" />
        </article>
      `).join('');
    }

    function popularFiltros() {
      const categorias = ['TODAS', ...new Set(state.productos.map(categoriaProducto))];
      const marcas = ['TODAS', ...new Set(state.productos.map(marcaProducto))];
      $('filtroCategoria').innerHTML = categorias.map(v => `<option value="${v}">${v}</option>`).join('');
      $('filtroMarca').innerHTML = marcas.map(v => `<option value="${v}">${v}</option>`).join('');
    }

    function agregarCarrito(producto) {
      const idx = state.carrito.findIndex((i) => i.id === producto.id);
      if (idx >= 0) state.carrito[idx].cantidad += 1;
      else state.carrito.push({ id: producto.id, producto, cantidad: 1 });
      renderCarrito();
    }

    function renderCatalogo() {
      const q = $('buscar').value.toLowerCase().trim();
      const fc = $('filtroCategoria').value;
      const fm = $('filtroMarca').value;
      const fe = $('filtroEstado').value;

      const list = state.productos.filter((p) => {
        const txt = `${p.nombreProducto || ''} ${marcaProducto(p)} ${presentacionProducto(p)}`.toLowerCase();
        const est = estadoProducto(p);
        if (fc !== 'TODAS' && categoriaProducto(p) !== fc) return false;
        if (fm !== 'TODAS' && marcaProducto(p) !== fm) return false;
        if (fe !== 'TODOS' && est !== fe) return false;
        if (q && !txt.includes(q)) return false;
        return true;
      });

      $('catalog').innerHTML = list.map((p) => `
        <article class="product">
          <span class="status ${estadoProducto(p)}">${estadoProducto(p)}</span>
          <strong>${p.nombreProducto || 'Producto sin nombre'}</strong>
          <span class="meta">Marca/laboratorio: ${marcaProducto(p)}</span>
          <span class="meta">Categoría: ${categoriaProducto(p)}</span>
          <span class="meta">Presentación: ${presentacionProducto(p)}</span>
          <button class="btn btn-add" data-add="${p.id}">Agregar</button>
        </article>
      `).join('') || '<p>No hay productos para esos filtros.</p>';

      document.querySelectorAll('[data-add]').forEach((btn) => {
        btn.onclick = () => {
          const p = state.productos.find((x) => String(x.id) === String(btn.dataset.add));
          if (p) agregarCarrito(p);
        };
      });
    }

    function renderCarrito() {
      $('cartEmpty').style.display = state.carrito.length ? 'none' : 'block';
      $('cart').innerHTML = state.carrito.map((it, idx) => `
        <div class="cart-item">
          <div class="cart-row"><strong>${it.producto.nombreProducto}</strong><button class="btn btn-outline" data-rm="${idx}">Quitar</button></div>
          <div class="small">${marcaProducto(it.producto)} · ${categoriaProducto(it.producto)} · ${presentacionProducto(it.producto)}</div>
          <div class="cart-row" style="margin-top:.35rem;">
            <span class="small">Cantidad</span>
            <input class="qty" type="number" min="1" value="${it.cantidad}" data-qty="${idx}" />
          </div>
        </div>
      `).join('');

      document.querySelectorAll('[data-rm]').forEach((btn) => btn.onclick = () => { state.carrito.splice(Number(btn.dataset.rm), 1); renderCarrito(); });
      document.querySelectorAll('[data-qty]').forEach((inp) => inp.onchange = () => {
        const i = Number(inp.dataset.qty);
        state.carrito[i].cantidad = Math.max(1, Number(inp.value || 1));
      });
    }

    function enviarWhatsApp() {
      if (!state.carrito.length) return alert('Agregá al menos un producto.');
      const nombre = $('nombre').value.trim();
      const telefono = $('telefono').value.trim();
      const localidad = $('localidad').value.trim();
      const obs = $('obs').value.trim();

      const productos = state.carrito.map((it) => `- ${it.producto.nombreProducto} | ${marcaProducto(it.producto)} | ${categoriaProducto(it.producto)} | ${presentacionProducto(it.producto)} | Cantidad: ${it.cantidad}`).join('\n');
      const texto = [
        'Hola, quiero solicitar presupuesto por estas semillas…',
        `Nombre: ${nombre || 'No informado'}`,
        `Teléfono: ${telefono || 'No informado'}`,
        `Localidad: ${localidad || 'No informada'}`,
        'Productos:',
        productos,
        `Observaciones: ${obs || 'Sin observaciones'}`
      ].join('\n');

      window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`, '_blank');
    }

    async function cargarListas() {
      const r = await fetch('/api/listas-comerciales');
      state.listas = await r.json();
      $('lista').innerHTML = state.listas.map(l => `<option value="${l.id}">${l.nombre} · ${l.empresaComercial?.nombre || 'Proveedor'}</option>`).join('');
      if (state.listas.length) await cargarProductos(state.listas[0].id);
    }

    async function cargarProductos(listaId) {
      const r = await fetch(`/api/listas-comerciales/${listaId}/productos`);
      state.productos = await r.json();
      popularFiltros();
      renderCatalogo();
    }

    ['buscar', 'filtroCategoria', 'filtroMarca', 'filtroEstado'].forEach((id) => $(id).addEventListener('input', renderCatalogo));
    $('lista').addEventListener('change', (e) => cargarProductos(e.target.value));
    $('enviar').addEventListener('click', enviarWhatsApp);

    renderBrands();
    cargarListas().catch(() => {
      $('catalog').innerHTML = '<p>No se pudo cargar el catálogo de PRECAMPAÑA.</p>';
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mostrador</title>
    <link rel="stylesheet" href="/app/styles.css" />
  </head>
  <body>
    <h1>Mostrador</h1>

    <section class="bloque">
      <button id="btn-nueva">Nueva venta</button>
      <strong id="venta-activa">Sin venta activa</strong>
    </section>

    <section class="bloque">
      <h2>1) Buscador de productos</h2>
      <input id="buscar-producto" placeholder="Escriba para buscar producto" />
      <div id="resultados-productos" class="lista"></div>
    </section>

    <section class="bloque">
      <h2>2) Carrito (siempre visible)</h2>
      <table>
        <thead><tr><th>Nombre</th><th>Precio</th><th>Cantidad</th><th>Subtotal</th></tr></thead>
        <tbody id="carrito"></tbody>
      </table>
      <label>Descuento $ <input id="descuento" type="number" min="0" value="0" /></label>
      <p>Total: <span id="total">$0.00</span></p>
      <p><b>Total final: <span id="total-final">$0.00</span></b></p>
    </section>

    <section class="bloque">
      <h2>3) Cliente</h2>
      <input id="buscar-cliente" placeholder="Buscar por nombre / teléfono / cuit" />
      <button id="btn-buscar-cliente">Buscar cliente</button>
      <div id="resultados-clientes" class="lista"></div>

      <h3>Crear rápido</h3>
      <input id="nuevo-nombre" placeholder="Nombre obligatorio" />
      <input id="nuevo-telefono" placeholder="Teléfono opcional" />
      <input id="nuevo-cuit" placeholder="CUIT opcional" />
      <button id="btn-crear-cliente">Crear cliente</button>

      <p>Cliente seleccionado: <strong id="cliente-activo">Ninguno</strong></p>
    </section>

    <section class="bloque">
      <h2>4) Cerrar venta</h2>
      <button id="btn-cerrar">Cerrar venta</button>
    </section>

    <section class="bloque">
      <h2>5) Caja</h2>
      <div id="pendientes">Cargando...</div>
    </section>

    <p id="msg"></p>
    <script src="/app/main.js"></script>
  </body>
</html>
